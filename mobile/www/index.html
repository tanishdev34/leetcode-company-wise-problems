<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LC Grind</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a0a; color: #fafafa; font-family: system-ui, -apple-system, sans-serif; }
      .wrap { display: grid; place-items: center; height: 100%; gap: 1rem; }
      .spinner { width: 32px; height: 32px; border: 3px solid #333; border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner"></div>
      <div>Loading LC Grind…</div>
    </div>
  </body>
</html>
